machine: scope
states:
  none:   {kind: policy}
  active: {kind: policy}
  paused: {kind: policy}
  ended:  {kind: policy}
  closed: {kind: fact, terminal: true}
initial: none
events: [authorize, act, pause, resume, end, close, rebase, copy, reallocate, check]
rules:
