name: go

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go.yml"
      - "Makefile"
  push:
    branches: [main, "poc/**"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go.yml"
      - "Makefile"

# GO_VERSION is the single source of truth for this workflow's toolchain
# pin. A stdlib CVE that only a toolchain release can clear is remediated
# by editing this one value; every job below reads it. The companion pin
# in gitleaks.yml is that workflow's own.
env:
  GO_VERSION: "1.25.12"

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      # Tag-gated sources compile in no other job: `go test ./...` builds
      # neither, so a type error in a `stress`- or `testpins`-tagged file
      # reaches trunk clean and surfaces only when someone runs
      # `make stress-tests` by hand. Vetting each tagged configuration
      # costs a compile and runs no scenario.
      - run: go vet -tags stress ./...
      - run: go vet -tags testpins ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
      # Execution firing harness for the golangci-lint config rules
      # (G-0264 / M-0170). The action above does not put golangci-lint on
      # PATH for later steps, so install the binary here — version sourced
      # from the action pin above so there is a single source of truth.
      # AIWF_REQUIRE_GOLANGCI=1 makes the harness fail (not skip) if
      # golangci-lint is somehow absent: no silent vacuous skip.
      - name: Linter-config rule firing harness
        env:
          AIWF_REQUIRE_GOLANGCI: "1"
        run: |
          ver=$(grep -A2 'golangci/golangci-lint-action@v7' .github/workflows/go.yml | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "installing golangci-lint $ver (sourced from the action pin)"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$ver"
          golangci-lint version
          go test -run '^TestGolangciConfigRulesFire$' -count=1 ./internal/policies/

  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives the diff-scoped coverage gate (below) the
      # full history it needs to resolve the merge-base with origin/main
      # (PRs) or reach github.event.before (trunk pushes). G-0067.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Configure git identity for tests
        run: |
          git config --global user.name "aiwf-ci"
          git config --global user.email "ci@example.com"
      # G-0156: hooks materialized by `aiwf init` in integration tests
      # resolve `aiwf` via PATH at hook execution time (post-M-0133 /
      # G-0135 portable-hooks design). Without aiwf on PATH every
      # in-test `git commit` fails. `actions/setup-go` puts
      # `$(go env GOPATH)/bin` on PATH automatically.
      - name: Install aiwf to PATH (required for hooks in tests)
        run: go install ./cmd/aiwf
      # M-0162/AC-4: enables the branchtest Pin
      # registry + the bijection sabotage subtests in
      # internal/policies/m0162_ac4_sabotage_testpins_test.go.
      # Without the tag, the registry is a no-op and the meta-cells
      # would surface as unpinned (caught by AC-4 static check
      # invariant 1). With the tag, the sabotage subtests run their
      # synthetic-data assertions per AC-4 body §"Mechanical
      # assertions" item 4.
      # -race forces -covermode=atomic; the profile feeds both the
      # informational summary and the diff-scoped gate below.
      - run: go test -tags testpins -exec=$GITHUB_WORKSPACE/scripts/sign-and-run.sh -race -parallel 8 -covermode=atomic -coverprofile=coverage.out -coverpkg=./internal/... ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      # Profile-driven policy gates. These gates read the coverage profile
      # built above and/or the base ref; all skip in the broad test run
      # (no profile/base env), so they fire exactly once here:
      #   - Diff-scoped coverage gate (G-0067): fail if any statement on a
      #     line changed vs the base is neither tested nor //coverage:ignore'd.
      #   - Firing-fixture-presence meta-gate (G-0259): fail if any
      #     non-grandfathered policy has a firing branch no test covers,
      #     and keep the grandfatherDark ledger free of stale entries.
      #   - Skill-edit structural-test backstop (G-0220): fail if a commit
      #     edits a ritual SKILL.md under internal/skills/embedded-rituals
      #     with no referencing structural test under internal/policies/.
      #     Diff-scoped on the base ref.
      # The base is the merge-base with origin/main on a PR, or
      # github.event.before on a trunk push; an all-zero before-SHA (a
      # brand-new branch) makes the diff-scoped audits no-op.
      - name: Resolve coverage base ref
        id: covbase
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin main || true
            echo "base=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Profile-driven coverage gates
        env:
          AIWF_COVERAGE_PROFILE: ${{ github.workspace }}/coverage.out
          AIWF_COVERAGE_BASE: ${{ steps.covbase.outputs.base }}
        run: go test -exec=$GITHUB_WORKSPACE/scripts/sign-and-run.sh -run '^TestPolicy_(BranchCoverageAudit|FiringFixturePresence|FiringFixtureNoStaleAllowlist|SkillEditStructuralTestBackstop|CommentHistoryAttrition|TestExecutableWrite)$' -count=1 ./internal/policies/
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build aiwf
        run: |
          CGO_ENABLED=0 go build -o /tmp/aiwf ./cmd/aiwf
          /tmp/aiwf version
          /tmp/aiwf help

  # vuln scans for reachable CVEs in two lanes, because the two classes
  # have different remediators:
  #
  #   - A dependency CVE is actionable in this repository right now —
  #     bump the module — so it blocks, per the kernel's "validation is
  #     the chokepoint" principle. The dep set is small (go-cmp /
  #     goldmark / yaml.v3) so the run is ~10s.
  #   - A stdlib CVE clears only on a toolchain release this repository
  #     does not control. Blocking on it makes every push red for a
  #     reason no change under test can address, which spends more
  #     signal than it buys. It is reported as a warning annotation and
  #     in the job summary, and the remediation is to bump GO_VERSION
  #     at the top of this workflow.
  #
  # Both lanes read one scan. "Reachable" means a symbol-level finding —
  # trace[0].function is set, i.e. govulncheck resolved a call path from
  # this module's code into the vulnerable symbol. Module- and
  # package-level findings (function null) are "present but not called"
  # and gate nothing, matching what the text-mode exit code did before.
  #
  # govulncheck is pinned rather than resolved at @latest so the
  # scanner's own version is a reviewed input rather than a moving one:
  # a scanner bump can change the verdict without any change here.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The stdlib lane's verdict is a statement about one exact
      # toolchain. setup-go selects some other Go — go.mod's floor, or
      # the preinstalled one — rather than failing when `go-version`
      # resolves to an empty string, so a GO_VERSION reference that
      # stopped resolving would scan a toolchain nobody chose, silently.
      # Assert the pin took effect before scanning.
      #
      # This comparison requires GO_VERSION to be a full patch version:
      # `go env GOVERSION` reports e.g. go1.25.12, so a minor-only pin
      # like "1.25" fails here by construction. That coupling is
      # deliberate — the vuln job's verdict is only meaningful against an
      # exact version — but it means GO_VERSION cannot be loosened
      # without reworking this step.
      - name: Confirm the pinned toolchain is active
        run: |
          active=$(go env GOVERSION)
          if [ "$active" != "go${{ env.GO_VERSION }}" ]; then
            echo "::error::expected go${{ env.GO_VERSION }} but the active toolchain is $active — the GO_VERSION pin did not take effect."
            exit 1
          fi
          echo "toolchain: $active"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      # JSON mode always exits 0, so each lane below derives its own
      # verdict from this one scan rather than from an exit code.
      - name: Scan
        run: govulncheck -format=json ./... > govulncheck.json
      # Fail closed on a scanner-schema change. Both lanes below read
      # their verdict out of this JSON, so a shape change would make jq
      # match nothing and report "no CVEs" for a scan that found some.
      # `protocol_version` is govulncheck's own compatibility signal and
      # the thing that moves when the record shape does — `scanner_name`
      # would survive a rename of every field the lanes actually read.
      # `// empty` matters: without it a missing key yields the string
      # "null", which is non-empty and would pass this check.
      #
      # This guard covers a *versioned* shape change. A silent one is
      # caught by the lanes themselves: each runs a single jq invocation
      # (no pipeline), so a jq runtime error propagates through `set -e`
      # rather than being masked by a downstream command's exit status.
      - name: Confirm the scan is readable
        run: |
          set -o pipefail
          proto=$(jq -r 'select(.config) | .config.protocol_version // empty' govulncheck.json)
          if [ "$proto" != "v1.0.0" ]; then
            echo "::error::govulncheck JSON reports protocol_version '${proto:-<absent>}', but the CVE filters below are written against v1.0.0. Their silence cannot be trusted. Re-read the govulncheck release notes and update the jq filters."
            head -40 govulncheck.json
            exit 1
          fi
          echo "scan readable (protocol $proto)"
      # `unique` inside jq rather than `| sort -u`: GitHub's default `run:`
      # shell on Linux is `bash -e` without `pipefail`, so in a pipeline
      # the assignment would take sort's exit status and discard a jq
      # failure — leaving this blocking lane green on a scan it could not
      # read. `set -o pipefail` is belt-and-braces for the same reason.
      - name: Dependency CVEs (blocking)
        run: |
          set -o pipefail
          found=$(jq -s -r '[
            .[]
            | select(.finding)
            | select(.finding.trace[0].function != null)
            | select(.finding.trace[0].module != "stdlib")
            | "\(.finding.osv)\t\(.finding.trace[0].module)\t\(.finding.trace[0].package).\(.finding.trace[0].function)\tfixed in \(.finding.fixed_version // "no fixed version published")\thttps://pkg.go.dev/vuln/\(.finding.osv)"
          ] | unique | .[]' govulncheck.json)
          if [ -n "$found" ]; then
            echo "::error::govulncheck: reachable CVE in a dependency — bump the module to the fixed version named below."
            printf '%s\n' "$found"
            exit 1
          fi
          echo "No reachable dependency CVEs."
      # if: always() so a blocking dependency CVE does not also suppress
      # the stdlib report — the two lanes are independent verdicts.
      - name: Stdlib CVEs (reported, non-blocking)
        if: always()
        run: |
          set -o pipefail
          # Report the toolchain actually scanned, not the pin it was
          # expected to be: a summary that names a version it did not
          # measure is only as good as a guard several steps earlier.
          active=$(go env GOVERSION)
          found=$(jq -s -r '[
            .[]
            | select(.finding)
            | select(.finding.trace[0].function != null)
            | select(.finding.trace[0].module == "stdlib")
            | "\(.finding.osv)\t\(.finding.trace[0].package).\(.finding.trace[0].function)\thttps://pkg.go.dev/vuln/\(.finding.osv)"
          ] | unique | .[]' govulncheck.json)
          if [ -z "$found" ]; then
            echo "No reachable stdlib CVEs."
            echo "No reachable stdlib CVEs at $active." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::govulncheck: reachable stdlib CVE at $active — remediate by bumping GO_VERSION in .github/workflows/go.yml."
          printf '%s\n' "$found"
          {
            echo "### Reachable stdlib CVEs at $active"
            echo
            echo "Non-blocking: remediation is a toolchain bump (\`GO_VERSION\` in \`.github/workflows/go.yml\`), not a change in this repository."
            echo
            echo "| Advisory | Symbol |"
            echo "|---|---|"
            printf '%s\n' "$found" | awk -F'\t' '{printf "| [%s](%s) | `%s` |\n", $1, $3, $2}'
          } >> "$GITHUB_STEP_SUMMARY"

  # selfcheck drives every verb against a temp repo via
  # `aiwf doctor --self-check`. Catches end-to-end regressions
  # (broken commit trailers, hook installer drift, missing skills,
  # `aiwf init` against a fresh git repo failing) that unit tests miss.
  # If this fails, a verb's end-to-end behavior regressed.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Configure git identity for the test repo
        run: |
          git config --global user.name "aiwf-ci"
          git config --global user.email "ci@example.com"
      # G-0156: aiwf doctor --self-check materializes hooks in its temp
      # repo that resolve `aiwf` via PATH at hook execution time. Without
      # aiwf on PATH the self-check fails at step 3 (add epic) when the
      # pre-commit hook can't find the binary.
      - name: Install aiwf to PATH (required for hooks in selfcheck repo)
        run: go install ./cmd/aiwf
      - name: Build and run aiwf doctor --self-check
        run: make selfcheck
