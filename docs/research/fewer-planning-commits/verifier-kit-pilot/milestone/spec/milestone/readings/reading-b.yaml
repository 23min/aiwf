# Reading B of the milestone chapter, by claude-fable-5-2, 2026-11-16. Made from (git hash-object):
# chapter.md a43a6fa48bfce5c832be8c44310e1d37cc60bc84, readings/prompt.md bcbfb148f4e4f22373f6fe903d371fa5dad4a766,
# docs/reference/spine-format.md 195c96437c338f026e1570510471f2efdafc77f5. The reader was given the filled-in
# prompt as one file to read. The reply below is unedited.
machine: milestone
states:
  draft_open: {kind: policy}
  draft_met: {kind: policy}
  draft_deferred: {kind: policy}
  draft_cancelled: {kind: policy}
  in_progress_open: {kind: policy}
  in_progress_met: {kind: policy}
  in_progress_deferred: {kind: policy}
  in_progress_cancelled: {kind: policy}
  done_met: {kind: fact}
  done_deferred: {kind: fact, terminal: true}
  done_cancelled: {kind: fact, terminal: true}
  cancelled_met: {kind: fact}
  cancelled_deferred: {kind: fact, terminal: true}
  cancelled_cancelled: {kind: fact, terminal: true}
initial: draft_open
events: [start, finish, back, cancel, meet, defer, drop, reopen, check]
outputs: [commit]
rules:
  # draft_open
  - {from: draft_open, event: start, to: in_progress_open, outputs: [commit]}
  - {from: draft_open, event: finish, reject: true}
  - {from: draft_open, event: back, ignore: true}
  - {from: draft_open, event: cancel, reject: true}
  # undecided: draft_open/meet - whether the AC may move while the milestone is draft (rule 10)
  # undecided: draft_open/defer - whether the AC may move while the milestone is draft (rule 10)
  # undecided: draft_open/drop - whether the AC may move while the milestone is draft (rule 10)
  # undecided: draft_open/reopen - whether ADR-0036 covers an AC, so reopen on an open AC is a no-op or refused (rule 11)
  - {from: draft_open, event: check, stay: true, outputs: []}

  # draft_met
  - {from: draft_met, event: start, to: in_progress_met, outputs: [commit]}
  - {from: draft_met, event: finish, reject: true}
  - {from: draft_met, event: back, ignore: true}
  - {from: draft_met, event: cancel, to: cancelled_met, outputs: [commit]}
  # undecided: draft_met/meet - whether ADR-0036 covers an AC, so meet on a met AC is a no-op or refused (rule 11)
  # undecided: draft_met/defer - whether the AC may move while the milestone is draft (rule 10)
  # undecided: draft_met/drop - whether the AC may move while the milestone is draft (rule 10)
  - {from: draft_met, event: reopen, reject: true}
  - {from: draft_met, event: check, stay: true, outputs: []}

  # draft_deferred
  # undecided: draft_deferred/start - whether a milestone whose only AC is deferred counts as one with no ACs (rule 6)
  - {from: draft_deferred, event: finish, reject: true}
  - {from: draft_deferred, event: back, ignore: true}
  - {from: draft_deferred, event: cancel, to: cancelled_deferred, outputs: [commit]}
  - {from: draft_deferred, event: meet, reject: true}
  # undecided: draft_deferred/defer - whether ADR-0036 covers an AC, so defer on a deferred AC is a no-op or refused (rule 11)
  # undecided: draft_deferred/drop - whether ADR-0036 covers an AC, so drop on a deferred AC is a no-op or refused (rule 11)
  - {from: draft_deferred, event: reopen, reject: true}
  - {from: draft_deferred, event: check, stay: true, outputs: []}

  # draft_cancelled
  # undecided: draft_cancelled/start - whether a milestone whose only AC is cancelled counts as one with no ACs (rule 6)
  - {from: draft_cancelled, event: finish, reject: true}
  - {from: draft_cancelled, event: back, ignore: true}
  - {from: draft_cancelled, event: cancel, to: cancelled_cancelled, outputs: [commit]}
  - {from: draft_cancelled, event: meet, reject: true}
  - {from: draft_cancelled, event: defer, reject: true}
  # undecided: draft_cancelled/drop - whether ADR-0036 covers an AC, so drop on a cancelled AC is a no-op or refused (rule 11)
  - {from: draft_cancelled, event: reopen, reject: true}
  - {from: draft_cancelled, event: check, stay: true, outputs: []}

  # in_progress_open
  - {from: in_progress_open, event: start, ignore: true}
  - {from: in_progress_open, event: finish, reject: true}
  - {from: in_progress_open, event: back, reject: true}
  - {from: in_progress_open, event: cancel, reject: true}
  - {from: in_progress_open, event: meet, to: in_progress_met, outputs: [commit]}
  - {from: in_progress_open, event: defer, to: in_progress_deferred, outputs: [commit]}
  - {from: in_progress_open, event: drop, to: in_progress_cancelled, outputs: [commit]}
  # undecided: in_progress_open/reopen - whether ADR-0036 covers an AC, so reopen on an open AC is a no-op or refused (rule 11)
  - {from: in_progress_open, event: check, stay: true, outputs: []}

  # in_progress_met
  - {from: in_progress_met, event: start, ignore: true}
  - {from: in_progress_met, event: finish, to: done_met, outputs: [commit]}
  - {from: in_progress_met, event: back, reject: true}
  - {from: in_progress_met, event: cancel, to: cancelled_met, outputs: [commit]}
  # undecided: in_progress_met/meet - whether ADR-0036 covers an AC, so meet on a met AC is a no-op or refused (rule 11)
  - {from: in_progress_met, event: defer, to: in_progress_deferred, outputs: [commit]}
  - {from: in_progress_met, event: drop, to: in_progress_cancelled, outputs: [commit]}
  - {from: in_progress_met, event: reopen, reject: true}
  - {from: in_progress_met, event: check, stay: true, outputs: []}

  # in_progress_deferred
  - {from: in_progress_deferred, event: start, ignore: true}
  - {from: in_progress_deferred, event: finish, to: done_deferred, outputs: [commit]}
  - {from: in_progress_deferred, event: back, reject: true}
  - {from: in_progress_deferred, event: cancel, to: cancelled_deferred, outputs: [commit]}
  - {from: in_progress_deferred, event: meet, reject: true}
  # undecided: in_progress_deferred/defer - whether ADR-0036 covers an AC, so defer on a deferred AC is a no-op or refused (rule 11)
  # undecided: in_progress_deferred/drop - whether ADR-0036 covers an AC, so drop on a deferred AC is a no-op or refused (rule 11)
  - {from: in_progress_deferred, event: reopen, reject: true}
  - {from: in_progress_deferred, event: check, stay: true, outputs: []}

  # in_progress_cancelled
  - {from: in_progress_cancelled, event: start, ignore: true}
  - {from: in_progress_cancelled, event: finish, to: done_cancelled, outputs: [commit]}
  - {from: in_progress_cancelled, event: back, reject: true}
  - {from: in_progress_cancelled, event: cancel, to: cancelled_cancelled, outputs: [commit]}
  - {from: in_progress_cancelled, event: meet, reject: true}
  - {from: in_progress_cancelled, event: defer, reject: true}
  # undecided: in_progress_cancelled/drop - whether ADR-0036 covers an AC, so drop on a cancelled AC is a no-op or refused (rule 11)
  - {from: in_progress_cancelled, event: reopen, reject: true}
  - {from: in_progress_cancelled, event: check, stay: true, outputs: []}

  # done_met
  - {from: done_met, event: start, reject: true}
  - {from: done_met, event: finish, ignore: true}
  - {from: done_met, event: back, reject: true}
  - {from: done_met, event: cancel, ignore: true}
  # undecided: done_met/meet - whether ADR-0036 covers an AC, so meet on a met AC is a no-op or refused (rule 11), and whether the AC may be acted on while the milestone is done (rule 10)
  # undecided: done_met/defer - whether the AC may move while the milestone is done (rule 10)
  # undecided: done_met/drop - whether the AC may move while the milestone is done (rule 10)
  - {from: done_met, event: reopen, reject: true}
  - {from: done_met, event: check, stay: true, outputs: []}

  # cancelled_met
  - {from: cancelled_met, event: start, reject: true}
  - {from: cancelled_met, event: finish, reject: true}
  - {from: cancelled_met, event: back, reject: true}
  - {from: cancelled_met, event: cancel, ignore: true}
  # undecided: cancelled_met/meet - whether ADR-0036 covers an AC, so meet on a met AC is a no-op or refused (rule 11), and whether the AC may be acted on while the milestone is cancelled (rule 10)
  # undecided: cancelled_met/defer - whether the AC may move while the milestone is cancelled (rule 10)
  # undecided: cancelled_met/drop - whether the AC may move while the milestone is cancelled (rule 10)
  - {from: cancelled_met, event: reopen, reject: true}
  - {from: cancelled_met, event: check, stay: true, outputs: []}
