<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="545" version="1.1" viewBox="0 0 1200 545" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><rect fill="#F8FAFC" height="545" width="1200" x="0" y="0" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" x="36" y="42">One effort, three different boundaries</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" x="37" y="67">A conceptual model for comparison, not a proposal for three new persisted entities</text><rect fill="#FFFFFF" height="122" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="340" x="40" y="113" /><rect fill="#2563EB" height="122" rx="2" ry="2" width="5" x="40" y="113" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="58" y="144">Worktree A — M-0362</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="58" y="169">Unfinished entity edits + code changes</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="58" y="189">Local, isolated from worktree B</text><rect fill="#FFFFFF" height="122" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="340" x="40" y="262" /><rect fill="#2563EB" height="122" rx="2" ry="2" width="5" x="40" y="262" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="58" y="293">Worktree B — M-0363</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="58" y="318">Own draft and code branch</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="58" y="338">A different actor or assistant</text><rect fill="#FFFFFF" height="176" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="302" x="477" y="155" /><rect fill="#0F766E" height="176" rx="2" ry="2" width="5" x="477" y="155" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="495" y="186">Accepted workflow state</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="495" y="211">Backend depends on contender:</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="495" y="231">branch integration · Git ref · Dolt</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="495" y="251">Only confirmed changes are shared</text><rect fill="#FFFFFF" height="105" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="282" x="874" y="125" /><rect fill="#7C3AED" height="105" rx="2" ry="2" width="5" x="874" y="125" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="892" y="156">Normal source history</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="892" y="181">Meaningful code and docs commits</text><rect fill="#FFFFFF" height="104" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="282" x="874" y="275" /><rect fill="#B45309" height="104" rx="2" ry="2" width="5" x="874" y="275" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="892" y="306">Published planning in main</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="892" y="331">Readable Markdown at checkpoints</text><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="380" x2="477" y1="174" y2="206" /><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="380" x2="477" y1="313" y2="280" /><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="779" x2="874" y1="225" y2="177" /><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="779" x2="874" y1="262" y2="327" /><text fill="#0F766E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="435" y="112">publish</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="780" y="394">Projection is pinned to an accepted revision.</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="40" y="427">Batched Git is different: acceptance occurs when a planning commit integrates into the canonical branch.</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="40" y="453">Live-store candidates can accept a workflow transaction without changing any code branch.</text><line stroke="#CBD5E1" stroke-width="1" x1="35" x2="1165" y1="476" y2="476" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="38" y="497">All worktrees retain ordinary Git semantics; no new WorkUnit model is implied by this diagram.</text></svg>