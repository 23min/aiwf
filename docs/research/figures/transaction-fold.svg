<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1060 440" width="1060" height="440">
  <title>A transaction's branch before and after submit</title>
  <style>
    :root {
      --surface: #ffffff; --ink: #15202b; --ink-2: #3b4755; --muted: #5a6676;
      --line: #c6ced8; --line-2: #8a96a5;
      --zone-a: #e3ecf6;
      --accent: #0a6d89;
      --c-1: #e7e3f7; --c-1-s: #6556b0; --c-2: #ddefe3; --c-2-s: #2f7a4c;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #151d26; --ink: #e2e8ee; --ink-2: #b6c1cd; --muted: #95a3b2;
        --line: #33404f; --line-2: #627082;
        --zone-a: #13233a;
        --accent: #52c3e0;
        --c-1: #272245; --c-1-s: #a99df2; --c-2: #14291d; --c-2-s: #6fc593;
      }
    }
    .bg { fill: var(--surface); stroke: var(--line); }
    .z-a { fill: var(--zone-a); stroke: var(--line); }
    .n { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2; }
    .n.c1 { fill: var(--c-1); stroke: var(--c-1-s); }
    .n.c2 { fill: var(--c-2); stroke: var(--c-2-s); }
    .n.pc { fill: var(--surface); stroke: var(--accent); stroke-width: 2.2; }
    .chain { fill: none; stroke: var(--line-2); stroke-width: 1.4; }
    .base { fill: var(--line-2); }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
    .e.acc { stroke: var(--accent); stroke-width: 2.2; }
    .mk { fill: var(--ink-2); }
    .mk-acc { fill: var(--accent); }
    .tt { font: 600 12px var(--font-body); fill: var(--ink); }
    .tm { font: 600 11.5px var(--font-mono); fill: var(--ink); }
    .ts { font: 400 11px var(--font-body); fill: var(--muted); }
    .tp { font: 400 10.5px var(--font-mono); fill: var(--muted); }
    .tz { font: 500 10.5px var(--font-mono); letter-spacing: 0.06em; fill: var(--muted); }
    .te { font: 400 11px var(--font-body); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
    .te.acc-t { fill: var(--accent); }
  </style>
  <defs>
    <marker id="f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="f-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk-acc" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="50.5" width="1059" height="439" rx="10"/>

  <!-- Row 1: before submit -->
  <text class="tz" x="24" y="76">BEFORE SUBMIT · ONE COMMIT PER VERB, AS TODAY</text>
  <path class="chain" d="M56,122 H736"/>
  <circle class="base" cx="56" cy="122" r="6"/>
  <text class="ts" x="56" y="152" text-anchor="middle">base</text>
  <rect class="n c2" x="90" y="100" width="96" height="44" rx="6"/>
  <text class="tm" x="138" y="120" text-anchor="middle">feat: c1</text>
  <text class="ts" x="138" y="136" text-anchor="middle">code</text>
  <rect class="n c1" x="200" y="100" width="96" height="44" rx="6"/>
  <text class="tm" x="248" y="120" text-anchor="middle">add ac</text>
  <text class="ts" x="248" y="136" text-anchor="middle">aiwf verb</text>
  <rect class="n c2" x="310" y="100" width="96" height="44" rx="6"/>
  <text class="tm" x="358" y="120" text-anchor="middle">feat: c2</text>
  <text class="ts" x="358" y="136" text-anchor="middle">code</text>
  <rect class="n c1" x="420" y="100" width="96" height="44" rx="6"/>
  <text class="tm" x="468" y="120" text-anchor="middle">promote</text>
  <text class="ts" x="468" y="136" text-anchor="middle">aiwf verb</text>
  <rect class="n c2" x="530" y="100" width="96" height="44" rx="6"/>
  <text class="tm" x="578" y="120" text-anchor="middle">feat: c3</text>
  <text class="ts" x="578" y="136" text-anchor="middle">code</text>
  <rect class="n c1" x="640" y="100" width="96" height="44" rx="6"/>
  <text class="tm" x="688" y="120" text-anchor="middle">edit-body</text>
  <text class="ts" x="688" y="136" text-anchor="middle">aiwf verb</text>

  <!-- Submit -->
  <path class="e acc" d="M380,160 V226" marker-end="url(#f-arrow-acc)"/>
  <text class="te acc-t" x="396" y="184">submit: replays the planning commits as one at the tip, by three-way merge</text>
  <text class="te" x="396" y="202">folds only what is not yet pushed · signs as the operator · refuses others’ commits or ones mixing code and work/</text>

  <!-- Row 2: after submit -->
  <text class="tz" x="24" y="226">AFTER SUBMIT</text>
  <path class="chain" d="M56,264 H420"/>
  <circle class="base" cx="56" cy="264" r="6"/>
  <text class="ts" x="56" y="294" text-anchor="middle">base</text>
  <rect class="n c2" x="90" y="242" width="96" height="44" rx="6"/>
  <text class="tm" x="138" y="262" text-anchor="middle">feat: c1</text>
  <text class="ts" x="138" y="278" text-anchor="middle">code</text>
  <rect class="n c2" x="200" y="242" width="96" height="44" rx="6"/>
  <text class="tm" x="248" y="262" text-anchor="middle">feat: c2</text>
  <text class="ts" x="248" y="278" text-anchor="middle">code</text>
  <rect class="n c2" x="310" y="242" width="96" height="44" rx="6"/>
  <text class="tm" x="358" y="262" text-anchor="middle">feat: c3</text>
  <text class="ts" x="358" y="278" text-anchor="middle">code</text>
  <rect class="n pc" x="420" y="232" width="300" height="64" rx="7"/>
  <text class="tt" x="570" y="254" text-anchor="middle">planning commit</text>
  <text class="tp" x="570" y="271" text-anchor="middle">aiwf-verb: add · promote · edit-body</text>
  <text class="ts" x="570" y="287" text-anchor="middle">one trailer group per operation, in order</text>

  <!-- Merge -->
  <path class="e" d="M570,296 V350" marker-end="url(#f-arrow)"/>
  <text class="te" x="582" y="328">host merges: code and planning together</text>
  <rect class="z-a" x="420" y="352" width="300" height="52" rx="6"/>
  <text class="tt" x="570" y="374" text-anchor="middle">default branch</text>
  <text class="ts" x="570" y="392" text-anchor="middle">the published plan</text>

  <!-- Legend -->
  <rect class="n c2" x="24" y="430" width="18" height="14" rx="3"/>
  <text class="ts" x="50" y="441">code commit</text>
  <rect class="n c1" x="150" y="430" width="18" height="14" rx="3"/>
  <text class="ts" x="176" y="441">per-verb planning commit</text>
  <rect class="n pc" x="340" y="430" width="18" height="14" rx="3"/>
  <text class="ts" x="366" y="441">the planning commit</text>
  <text class="ts" x="24" y="470">Code commits after the first folded verb get new SHAs; submit folds nothing pushed, so nobody has seen the old ones.</text>
</svg>
