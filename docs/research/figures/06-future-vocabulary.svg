ry="12" stroke="#CBD5E1" stroke-width="1.4" width="322" x="438" y="270" /><rect fill="#0F766E" height="135" rx="2" ry="2" width="5" x="438" y="270" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="456" y="301">Workflow transactions</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="456" y="326">Groups of existing AIWF operations</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="456" y="346">Atomic publication semantics</text><rect fill="#FFFFFF" height="135" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="324" x="821" y="270" /><rect fill="#B45309" height="135" rx="2" ry="2" width="5" x="821" y="270" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="839" y="301">Snapshot publications</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="839" y="326">Optional Markdown checkpoint</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="839" y="346">GitHub-browsable evidence</text><line marker-end="url(#arrow)" stroke="#475569" stroke-dasharray="7,6" stroke-width="2" x1="215" x2="215" y1="218" y2="270" /><line marker-end="url(#arrow)" stroke="#475569" stroke-dasharray="7,6" stroke-width="2" x1="599" x2="599" y1="218" y2="270" /><line marker-end="url(#arrow)" stroke="#475569" stroke-dasharray="7,6" stroke-width="2" x1="983" x2="983" y1="218" y2="270" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="55" y="443">Possible future fields such as work_unit_id, tx_id or snapshot_id are NOT required by the near-term contract.</text><line stroke="#CBD5E1" stroke-width="1" x1="35" x2="1165" y1="456" y2="456" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="38" y="477">Promote a concept to a persistent record only when a tested use case cannot be served by existing entity IDs, trailers and Git revisions.</text></svg>