<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="785" version="1.1" viewBox="0 0 1200 785" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><rect fill="#F8FAFC" height="785" width="1200" x="0" y="0" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" x="36" y="42">Contender 3 — Dolt live store</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" x="37" y="67">AIWF preserves the same workflow semantics while Dolt handles versioned structured state</text><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#CBD5E1" stroke-width="1.3" width="254" x="28" y="98" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="155" y="122">Alice / agent A</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="155" y="140">code worktree + local DB</text><line stroke="#CBD5E1" stroke-dasharray="5,5" stroke-width="1.3" x1="155" x2="155" y1="150" y2="674" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#CBD5E1" stroke-width="1.3" width="254" x="310" y="98" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="437" y="122">Bob / agent B</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="437" y="140">code worktree + local DB</text><line stroke="#CBD5E1" stroke-dasharray="5,5" stroke-width="1.3" x1="437" x2="437" y1="150" y2="674" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#CBD5E1" stroke-width="1.3" width="254" x="599" y="98" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="726" y="122">Dolt remote</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="726" y="140">optionally Git-backed</text><line stroke="#CBD5E1" stroke-dasharray="5,5" stroke-width="1.3" x1="726" x2="726" y1="150" y2="674" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#CBD5E1" stroke-width="1.3" width="254" x="911" y="98" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1038" y="122">GitHub main</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="1038" y="140">published Markdown snapshot</text><line stroke="#CBD5E1" stroke-dasharray="5,5" stroke-width="1.3" x1="1038" x2="1038" y1="150" y2="674" /><line stroke="#CBD5E1" stroke-width="1" x1="38" x2="1162" y1="697" y2="697" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="43" y="725">Dolt merge outcomes are not automatically legal AIWF transitions; domain validation is still mandatory.</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="43" y="746">Per-worktree local database isolation and remote publication outcomes require direct experimentation.</text><path d="M 155 172 H 199 V 197 H 155" fill="none" stroke="#475569" stroke-width="2" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="205" y="186">local DB transaction + AIWF checks</text><path d="M 437 218 H 481 V 243 H 437" fill="none" stroke="#475569" stroke-width="2" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="487" y="232">local DB transaction + AIWF checks</text><line marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2" x1="162" x2="719" y1="275" y2="275" /><text fill="#2563EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="440.5" y="266">commit locally; synchronize state</text><line marker-end="url(#arrow)" stroke="#0F766E" stroke-width="2" x1="719" x2="162" y1="318" y2="318" /><text fill="#0F766E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="440.5" y="309">remote revision accepted</text><line marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2" x1="444" x2="719" y1="380" y2="380" /><text fill="#2563EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="581.5" y="371">attempt publish from old base</text><line marker-end="url(#arrow)" stroke="#B45309" stroke-width="2" x1="719" x2="444" y1="424" y2="424" /><text fill="#B45309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="581.5" y="415">stale state / merge required</text><path d="M 437 468 H 481 V 493 H 437" fill="none" stroke="#B45309" stroke-width="2" /><text fill="#B45309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="487" y="482">merge disjoint changes; validate</text><line marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2" x1="444" x2="719" y1="527" y2="527" /><text fill="#2563EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="581.5" y="518">publish revised transaction</text><line marker-end="url(#arrow)" stroke="#0F766E" stroke-width="2" x1="719" x2="444" y1="569" y2="569" /><text fill="#0F766E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="581.5" y="560">accepted or conflict refused</text><line marker-end="url(#arrow)" stroke="#7C3AED" stroke-width="2" x1="733" x2="1031" y1="628" y2="628" /><text fill="#7C3AED" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="882.0" y="619">optional: export pinned snapshot</text></svg>