<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="595" version="1.1" viewBox="0 0 1200 595" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><rect fill="#F8FAFC" height="595" width="1200" x="0" y="0" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" x="36" y="42">Transaction boundary and publication outcome</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" x="37" y="67">A transaction is a batch of existing AIWF operations; publication is backend-specific</text><rect fill="#FFFFFF" height="123" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="250" x="40" y="115" /><rect fill="#2563EB" height="123" rx="2" ry="2" width="5" x="40" y="115" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="58" y="146">Local draft</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="58" y="171">Edit 1..n entities</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="58" y="191">May be abandoned or amended</text><rect fill="#FFFFFF" height="123" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="250" x="333" y="115" /><rect fill="#0F766E" height="123" rx="2" ry="2" width="5" x="333" y="115" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="351" y="146">Validated candidate</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="351" y="171">Check final projected state</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="351" y="191">Keep attributable op evidence</text><rect fill="#FFFFFF" height="123" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="250" x="626" y="115" /><rect fill="#7C3AED" height="123" rx="2" ry="2" width="5" x="626" y="115" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="644" y="146">Publish attempt</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="644" y="171">Branch integration / Git ref push</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="644" y="191">or Dolt synchronization</text><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="290" x2="333" y1="176" y2="176" /><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="583" x2="626" y1="176" y2="176" /><rect fill="#FFFFFF" height="92" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="230" x="922" y="108" /><rect fill="#0F766E" height="92" rx="2" ry="2" width="5" x="922" y="108" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="940" y="139">Accepted</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="940" y="164">Whole transaction visible</text><rect fill="#FFFFFF" height="92" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="230" x="922" y="219" /><rect fill="#B91C1C" height="92" rx="2" ry="2" width="5" x="922" y="219" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="940" y="250">Conflict / refusal</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="940" y="275">No partial acceptance</text><rect fill="#FFFFFF" height="103" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="230" x="922" y="330" /><rect fill="#B45309" height="103" rx="2" ry="2" width="5" x="922" y="330" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" x="940" y="361">Unknown outcome</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="940" y="386">Do not claim success</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="940" y="406">Observe before retry</text><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="876" x2="922" y1="150" y2="150" /><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="876" x2="922" y1="189" y2="263" /><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="876" x2="922" y1="208" y2="373" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="39" y="286">Draft and candidate belong to one worktree (or one isolated local workspace).</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="39" y="317">A crash before publication must not turn an unsaved draft into claimed shared state.</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="39" y="350">A publish that times out may already have landed. Reconciliation checks accepted state first.</text><line stroke="#475569" stroke-dasharray="7,6" stroke-width="2" x1="922" x2="730" y1="391" y2="391" /><line marker-end="url(#arrow)" stroke="#475569" stroke-dasharray="7,6" stroke-width="2" x1="730" x2="730" y1="391" y2="245" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="550" y="380">recover / retry only after evidence</text><rect fill="#FFFFFF" height="73" rx="12" ry="12" stroke="#CBD5E1" stroke-width="1.4" width="560" x="40" y="407" /><rect fill="#B45309" height="73" rx="2" ry="2" width="5" x="40" y="407" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" x="58" y="438">Separate: planning snapshot publication</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" x="58" y="463">Render only from an identifiable accepted workflow revision</text><line stroke="#475569" stroke-dasharray="7,6" stroke-width="2" x1="1035" x2="1035" y1="200" y2="469" /><line marker-end="url(#arrow)" stroke="#475569" stroke-dasharray="7,6" stroke-width="2" x1="1035" x2="605" y1="469" y2="469" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="671" y="459">optional, later, independent</text><line stroke="#CBD5E1" stroke-width="1" x1="35" x2="1165" y1="526" y2="526" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="38" y="547">No “snapshotted” terminal transaction state: one accepted transaction can appear in zero or many later snapshots.</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="38" y="564">The accepted-state definition differs: branch integration for batched Git; remote acceptance for live stores.</text></svg>