<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="785" version="1.1" viewBox="0 0 1200 785" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><rect fill="#F8FAFC" height="785" width="1200" x="0" y="0" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" x="36" y="42">Contender 1 — Batched Git</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" x="37" y="67">Local batching reduces commits; collaboration still uses branch integration</text><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#CBD5E1" stroke-width="1.3" width="254" x="28" y="98" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="155" y="122">Alice / agent A</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="155" y="140">worktree feature/A</text><line stroke="#CBD5E1" stroke-dasharray="5,5" stroke-width="1.3" x1="155" x2="155" y1="150" y2="674" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#CBD5E1" stroke-width="1.3" width="254" x="310" y="98" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="437" y="122">Bob / agent B</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="437" y="140">worktree feature/B</text><line stroke="#CBD5E1" stroke-dasharray="5,5" stroke-width="1.3" x1="437" x2="437" y1="150" y2="674" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#CBD5E1" stroke-width="1.3" width="254" x="599" y="98" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="726" y="122">Git origin</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="726" y="140">two feature branches</text><line stroke="#CBD5E1" stroke-dasharray="5,5" stroke-width="1.3" x1="726" x2="726" y1="150" y2="674" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#CBD5E1" stroke-width="1.3" width="254" x="911" y="98" /><text fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1038" y="122">GitHub main</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="1038" y="140">canonical published branch</text><line stroke="#CBD5E1" stroke-dasharray="5,5" stroke-width="1.3" x1="1038" x2="1038" y1="150" y2="674" /><line stroke="#CBD5E1" stroke-width="1" x1="38" x2="1162" y1="697" y2="697" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="43" y="725">If both plans change the same entity, Git may require a merge; AIWF must still revalidate the complete result.</text><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="43" y="746">All planning state remains normal Git-tracked Markdown; no separate live workflow authority is assumed.</text><path d="M 155 172 H 199 V 197 H 155" fill="none" stroke="#475569" stroke-width="2" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="205" y="186">draft: 2 edits + promote</text><path d="M 437 220 H 481 V 245 H 437" fill="none" stroke="#475569" stroke-width="2" /><text fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="487" y="234">draft: 2 AC updates</text><line marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2" x1="162" x2="719" y1="276" y2="276" /><text fill="#2563EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="440.5" y="267">commit once + push feature/A</text><line marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2" x1="444" x2="719" y1="326" y2="326" /><text fill="#2563EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="581.5" y="317">commit once + push feature/B</text><line marker-end="url(#arrow)" stroke="#0F766E" stroke-width="2" x1="733" x2="1031" y1="383" y2="383" /><text fill="#0F766E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="882.0" y="374">PR merge A: planning becomes canonical</text><line marker-end="url(#arrow)" stroke="#B45309" stroke-width="2" x1="1031" x2="444" y1="446" y2="446" /><text fill="#B45309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="737.5" y="437">main advanced; rebase/merge</text><path d="M 437 494 H 481 V 519 H 437" fill="none" stroke="#B45309" stroke-width="2" /><text fill="#B45309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="487" y="508">resolve conflict if needed; revalidate</text><line marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2" x1="444" x2="719" y1="551" y2="551" /><text fill="#2563EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="581.5" y="542">push compatible revision</text><line marker-end="url(#arrow)" stroke="#0F766E" stroke-width="2" x1="733" x2="1031" y1="617" y2="617" /><text fill="#0F766E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="882.0" y="608">PR merge B, or reject illegal state</text></svg>